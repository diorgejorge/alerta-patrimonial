name: Python pronto
description: Python 3.12 com as dependências num ambiente guardado em cache; só instala quando requirements.txt ou os extras mudam.
inputs:
  extras:
    description: "Pacotes além do requirements.txt, ex.: pytest playwright"
    default: ""
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@v6
      with: { python-version: "3.12" }
    - id: venv
      uses: actions/cache@v4
      with:
        path: ~/.venv
        key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-${{ inputs.extras }}
    - if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: python -m venv ~/.venv && ~/.venv/bin/pip install -q -r requirements.txt ${{ inputs.extras }}
    - shell: bash
      run: echo "$HOME/.venv/bin" >> "$GITHUB_PATH"
