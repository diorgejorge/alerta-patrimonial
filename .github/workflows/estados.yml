name: 2 · Dossiê por estado
# #53: roda depois do "1 · Dados dos políticos" (que grava data/estados_base.json), para nao segurar o painel.
# Pode demorar: o SICONFI aceita ~1 consulta/s e os municipios entram em partes (cache continua de onde parou).
on:
  workflow_run:
    workflows: ["1 · Dados dos políticos"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: estados
  cancel-in-progress: false
jobs:
  rodar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: ./.github/actions/python
      - uses: actions/cache/restore@v4  # data/cache/estados.cache: municipios e anos de emendas ja lidos (cifrado)
        with:
          path: data/cache/estados.cache
          key: estados-${{ github.run_id }}
          restore-keys: estados-
      - run: python -u src/estados.py
        timeout-minutes: 160
        env:
          TRANSPARENCIA_TOKEN: ${{ secrets.TRANSPARENCIA_TOKEN }}
          ID_SEGREDO: ${{ secrets.ID_SEGREDO }}
      # salva mesmo se o passo acima falhar ou estourar o tempo: a proxima execucao continua de onde parou
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/cache/estados.cache') != ''
        with:
          path: data/cache/estados.cache
          key: estados-${{ github.run_id }}
      - name: Salvar resultados
        run: |
          git config user.name "alerta-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/estado
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza dossiê por estado"
          # outro push pode entrar entre o pull e o push: tenta de novo algumas vezes
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep $((i * 5)); done; exit 1
