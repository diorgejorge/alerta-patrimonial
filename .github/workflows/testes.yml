name: Testes e acessibilidade
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "config/**", ".github/workflows/testes.yml", ".github/lighthouserc.json"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests  # dados sinteticos, rede bloqueada
  interface:
    # #52: funcoes do card (unitario) e navegacao do painel (integracao) no Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest playwright
      # usa o Chrome que ja vem no runner (economiza o download do Chromium e das libs); sem ele, instala
      - run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROMIUM=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else python -m playwright install --with-deps chromium; fi
      - run: python -m pytest -q tests/test_painel.py
  lighthouse:
    # metas: acessibilidade >= 90 (bloqueia) e desempenho >= 90 (aviso: varia com a maquina do Actions), no celular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python src/pipeline.py --demo --saida _demo
        env: { ID_SEGREDO: lighthouse }
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
