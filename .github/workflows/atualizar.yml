name: Atualizar alertas
on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 09:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python src/pipeline.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar resultados
        run: |
          git config user.name "alerta-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs data/estado.json
          git diff --cached --quiet || (git commit -m "Atualiza alertas" && git push)
