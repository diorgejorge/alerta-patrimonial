name: Atualizar alertas
on:
  schedule:
    - cron: "0 7 * * 1"   # toda segunda, 07:00 UTC (04:00 em Brasília: faixa em que a API do Portal aceita 300 consultas/min)
  workflow_dispatch:
permissions:
  contents: write
concurrency:  # uma atualizacao por vez; a seguinte espera a anterior terminar
  group: atualizar
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -u src/pipeline.py  # -u: mostra o andamento no log na hora
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRANSPARENCIA_TOKEN: ${{ secrets.TRANSPARENCIA_TOKEN }}  # chave da API do Portal da Transparencia
          ID_SEGREDO: ${{ secrets.ID_SEGREDO }}  # gera o id interno das pessoas (sem CPF)
          MONITORADOS_CSV: ${{ secrets.MONITORADOS_CSV }}  # lista de monitorados; vazio = modo atual (200 maiores)
      - name: Salvar resultados
        run: |
          git config user.name "alerta-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs data  # data/cache fica fora pelo .gitignore
          git diff --cached --quiet || (git commit -m "Atualiza alertas" && git pull --rebase -X theirs && git push)
