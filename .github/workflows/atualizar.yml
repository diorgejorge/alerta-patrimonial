name: 1 · Dados dos políticos
on:
  schedule:
    - cron: "0 7 * * 1"   # toda segunda, 07:00 UTC (04:00 em Brasília: faixa em que a API do Portal aceita 300 consultas/min)
  workflow_dispatch:
permissions:
  contents: write
concurrency:  # uma atualizacao por vez; a seguinte espera a anterior terminar
  group: atualizar
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }  # disparo manual fixava o commit do clique e o push batia com a carga anterior
      - uses: ./.github/actions/python
      # data/cache: arquivos e resultados ja processados (TSE, cota, projetos, presenca, votacoes, Portal, contatos,
      # gabinete, noticias), todos cifrados; cada fonte so le de novo o que mudou
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tse-${{ github.run_id }}
          restore-keys: tse-
      - run: python -u src/pipeline.py  # -u: mostra o andamento no log na hora
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRANSPARENCIA_TOKEN: ${{ secrets.TRANSPARENCIA_TOKEN }}  # chave da API do Portal da Transparencia
          ID_SEGREDO: ${{ secrets.ID_SEGREDO }}  # gera o id interno das pessoas (sem CPF)
          MONITORADOS_CSV: ${{ secrets.MONITORADOS_CSV }}  # lista de monitorados; vazio = modo atual (200 maiores)
      # salva mesmo se a execucao falhar, estourar o tempo ou for cancelada: o que ja foi processado nao se perde
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/cache/**') != ''
        with:
          path: data/cache
          key: tse-${{ github.run_id }}
      - name: Salvar resultados
        run: |
          git config user.name "alerta-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs data  # data/cache fica fora pelo .gitignore
          git diff --cached --quiet || (git commit -m "Atualiza alertas" && git pull --rebase -X theirs && git push)
