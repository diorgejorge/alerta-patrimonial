name: 3 · Publicar site
on:
  push:
    branches: [main]
    paths: ["docs/**", "src/template.html", "src/estilo.css", "src/logo.png", "src/icone.png", "src/privacidade.html",
            "src/medicao.js", "src/selo.js", "src/paginas.py", "config/bens_referencia.json", "config/analytics.json", "config/privacidade.json"]
  workflow_run:
    workflows: ["1 · Dados dos políticos", "2 · Dossiê por estado"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # painel sempre com o template atual, mesmo sem rodar o pipeline (dados continuam os da ultima execucao)
      - name: Montar painel
        run: |
          python3 - <<'PY'
          import json, pathlib, re, shutil
          shutil.copytree("docs", "_site")
          m = re.search(r"^const D=(.*);$", pathlib.Path("docs/index.html").read_text(encoding="utf-8"), re.M)
          if m:
              html = pathlib.Path("src/template.html").read_text(encoding="utf-8").replace("/*DADOS*/null", m.group(1))
              try:  # bens de referencia ("daria para comprar"): sempre os do config atual
                  bens = json.loads(pathlib.Path("config/bens_referencia.json").read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  bens = None
              html = html.replace("/*BENS*/null", json.dumps(bens, ensure_ascii=False))
              try:
                  blocos = json.loads(pathlib.Path("docs/blocos.json").read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  blocos = {}
              for marca, conteudo in blocos.items():
                  html = html.replace(f"<!--{marca}-->", conteudo)
              pathlib.Path("_site/index.html").write_text(html, encoding="utf-8")
          import sys
          sys.path.insert(0, "src")
          import paginas
          paginas.copiar_estilo("_site")  # estilo, logo, icone e privacidade com o config atual
          print("Google Analytics ligado em", paginas.medicao("_site"), "paginas")  # 0 = sem id em config/analytics.json
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
