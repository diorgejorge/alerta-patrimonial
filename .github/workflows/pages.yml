name: Publicar painel
on:
  push:
    branches: [main]
    paths: ["docs/**", "src/template.html", "src/estilo.css", "src/logo.png", "src/icone.png", "src/metricas.py", "config/bens_referencia.json"]
  workflow_run:
    workflows: ["Atualizar alertas"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      # painel sempre com o template atual, mesmo sem rodar o pipeline (dados continuam os da ultima execucao)
      - name: Montar painel
        run: |
          python3 - <<'PY'
          import json, pathlib, re, shutil
          shutil.copytree("docs", "_site")
          m = re.search(r"^const D=(.*);$", pathlib.Path("docs/index.html").read_text(encoding="utf-8"), re.M)
          if m:
              html = pathlib.Path("src/template.html").read_text(encoding="utf-8").replace("/*DADOS*/null", m.group(1))
              try:  # bens de referencia ("daria para comprar"): sempre os do config atual
                  bens = json.loads(pathlib.Path("config/bens_referencia.json").read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  bens = None
              html = html.replace("/*BENS*/null", json.dumps(bens, ensure_ascii=False))
              try:
                  blocos = json.loads(pathlib.Path("docs/blocos.json").read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  blocos = {}
              for marca, conteudo in blocos.items():
                  html = html.replace(f"<!--{marca}-->", conteudo)
              pathlib.Path("_site/index.html").write_text(html, encoding="utf-8")
          shutil.copyfile("src/estilo.css", "_site/estilo.css")
          for img in ("logo.png", "icone.png"):
              shutil.copyfile(f"src/{img}", f"_site/{img}")
          PY
      - name: Contagem de acessos  # Google Analytics 4 so com consentimento; variavel GOOGLE_ANALYTICS vazia = desligada
        run: python3 src/metricas.py _site
        env:
          GOOGLE_ANALYTICS: ${{ vars.GOOGLE_ANALYTICS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
